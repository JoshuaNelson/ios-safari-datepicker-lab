<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="picker-version" content="{{VERSION}}">
<title>Date picker lab</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="base.css">
{{FIX_CSS}}
<style>
  /* Lab page layout only (stand-in for the surrounding page). */
  main{max-width:560px;margin:0 auto;padding:32px 7%}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:40px;line-height:1.1;margin:0 0 12px}
  .card{background:#e8e6e2;padding:24px 8%;display:grid;gap:22px}
  .filler{height:900px}
</style>
</head>
<body>
<main>
  <h1 id="heading">Picture your gathering.</h1>
  <p id="intro">A stand-in page with the same form structure as the page under test.</p>

  <!-- Same structure as the hello form: label.f wrapping the date input. -->
  <form id="planner" class="card" novalidate>
    <label class="f" for="hello-name">Your name<input id="hello-name" maxlength="60"></label>
    <label class="f" for="hello-date">Your date, if you know it <span class="f-opt">Optional</span><input id="hello-date" type="date"><span class="date-note" id="hello-date-note" aria-live="polite"></span></label>
    <label class="f" for="hello-when">Or roughly when? <span class="f-opt">If you don't have a date yet</span><input id="hello-when" maxlength="80" placeholder="For example, spring 2027"></label>
  </form>

  <!-- Same structure as planner step 3: a plain label wrapping a required date with a minimum. -->
  <section class="card" aria-labelledby="timing-title" style="margin-top:28px">
    <h2 id="timing-title" style="margin:0;font-weight:400">When shall we be there?</h2>
    <div class="planner-fields timing-fields timing-row">
      <label>Your date<input id="quote-date" type="date" required><span class="small" id="date-min-note">Two weeks or more is best.</span></label>
    </div>
  </section>
  <div class="filler"></div>
</main>
<script>
  // The page under test sets the earliest date to 14 days from today.
  document.getElementById('quote-date').min = new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
</script>
{{FIX_JS}}
</body>
</html>
